1. 작업 범위와 관련 문서를 확인한다.
2. 기존 파일, 테스트, 설정, 변경 내역과 실행 진입점을 조사한다.
3. 입력·출력·상태·실패 경계와 민감정보 흐름을 먼저 정의한다.
4. 테스트 가능한 공통 모듈과 기관별 어댑터를 분리한다.
5. 고정 HTML·DOM·첨부 테스트 자료로 정상·변경·부분 실패·재시도 경로를 검증한다.
