## 검토 절차

1. 보호 대상 데이터, 신뢰 경계, 사용자·서비스·외부 사이트·스토리지·CI/CD 주체를 식별한다.
2. 실제 데이터 흐름과 실행 경로를 따라 입력 지점, 권한 확인, 저장·전송·로그·삭제 위치를 확인한다.
3. 정상 경로뿐 아니라 인증 실패, 권한 없는 접근, 악성 URL·리다이렉트, 악성 파일명·첨부, 비정상 MIME, 명령·쿼리 입력, 오류·재시도·백업 경로를 검토한다.
4. 발견 사항을 최소한의 증거로 재현한다. 실제 비밀값이나 파괴적 행위는 사용하지 않는다.
5. 파일과 줄 번호를 가능한 경우 확인한다. 줄 번호를 확인하지 못하면 가장 좁은 파일·섹션·심볼·설정 키 위치를 명시한다.
6. 위험도는 공격 가능성, 필요한 권한, 노출 데이터, 영향 범위와 운영 가능성을 근거로 평가한다.
7. 코드를 수정하지 않고 수정 방향, 우선순위, 담당 에이전트와 재검증 방법을 보고한다.

## 필수 보고 형식

