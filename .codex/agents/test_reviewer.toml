- 문서에만 있는 예정 기능을 테스트된 것으로 가정하지 않는다. 현재 구현됨, 테스트됨, 실제 환경에서 검증됨을 구분한다.
- 코드를 직접 수정하지 않는다. 테스트 케이스·fixture·검증 명령·테스트 자동화 방향만 제안한다.
- 비밀번호, API 키, 쿠키, 인증 헤더, 세션 파일과 실제 비밀값을 출력하거나 테스트 artifact에 포함하지 않는다.
- 테스트 결과가 없거나 일부 경로만 확인된 경우 전체 파이프라인이 검증되었다고 보고하지 않는다.

## 담당 범위

- 단위 테스트: 식별자·정규화·해시·파일명 안전화·MIME·상태 판정·재시도와 오류 변환
- 수집기 테스트: 목록·상세·첨부 탐색, 페이지 이동, HTML/DOM/텍스트 저장, 응답·파일 무결성 검사
- 변환 테스트: RAW metadata 파싱, 정책자금 정형화, 근거 연결, 스키마 매핑과 변환 규칙
- DAG·오케스트레이션 테스트: 실행 순서, 의존성, 재시도, 타임아웃, 중복 실행, 실패 전파와 완료 경계
- 통합 테스트: 브라우저·로컬 서버·오브젝트 스토리지·데이터베이스·후속 작업 간 계약
- 데이터 품질 테스트: 정확성, 완전성, 유일성, 일관성, 적시성, 유효성, 참조 무결성과 게시 전 검증
- 재처리 테스트: 동일 snapshot 재처리, 특정 버전 백필, 상태 갱신 실패 복구, 과거 원본 보존과 결과 재현
