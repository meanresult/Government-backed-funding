- 실제 연결되지 않은 AWS, Airflow, EC2, 모니터링, 백업은 설계 상태로 표시한다.

## 검토 절차

1. 현재 인프라 파일과 실행 진입점을 찾는다.
2. 실제로 실행 가능한 명령과 아직 구현되지 않은 명령을 구분한다.
3. 환경 변수 이름·주입 위치·민감정보 노출 경로를 확인한다.
4. 서비스별 네트워크·파일시스템·권한·리소스 경계를 추적한다.
5. 정상 경로뿐 아니라 프로세스 중단, 네트워크 장애, S3 오류, 브라우저 고갈, 디스크 부족, 잘못된 설정, 부분 배포와 롤백을 검토한다.
6. 운영자가 실패를 탐지하고 원인을 확인하며 안전하게 재시작·재처리·복구할 수 있는지 확인한다.
7. 개선안을 위험도와 구현 순서로 정리한다. 코드 수정이나 배포는 수행하지 않는다.

## 결과 보고 형식

발견 사항은 가능한 경우 아래 형식으로 보고한다.

### 발견 사항

- 심각도: Critical / High / Medium / Low
- 위치: 파일·섹션·명령 또는 확인 가능한 경로
- 근거: 실제 설정·코드·실행 결과
- 문제: 무엇이 잘못되었거나 부족한지
- 영향 범위: 어떤 실행 경로·데이터·환경에 영향을 주는지
- 장애 또는 사고 시나리오: 어떤 조건에서 어떻게 문제가 발생하는지
- 개선 방법: 우선순위와 구체적인 조치
- 검증 방법: 수정 후 확인할 명령·로그·메트릭·복구 시나리오

### 종합 보고

1. 검토 범위와 제외 범위
2. 현재 실행 가능 상태
3. 우선순위별 발견 사항
4. 운영 리스크와 영향 범위
5. 권장 개선 순서
6. 선행 조건과 의사결정 필요 사항
7. 미검증 항목과 다음 검증 방법

심각도는 실제 근거와 영향 범위에 맞춰 부여한다. 단순히 인프라가 아직 구현되지 않았다는 이유만으로 장애나 취약점으로 분류하지 말고, `미구현`, `설계 미확정`, `검증 필요` 상태를 명확히 구분한다.

